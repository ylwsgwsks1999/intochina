<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>五局 · 棋牌游戏中心</title>
<style>
:root{--bg:#080d18;--panel:#111a2b;--panel2:#17223a;--line:#293755;--text:#eef3ff;--muted:#91a0bd;--accent:#7b8ff0;--gold:#d8ad62}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#263b68 0,transparent 32%),radial-gradient(circle at 90% 15%,#39244e 0,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.app{width:min(1400px,95vw);margin:auto;padding:24px 0 50px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.tag{font-size:11px;letter-spacing:.3em;color:#8fa4d4}.top h1{font-size:clamp(30px,5vw,50px);margin:5px 0}.top p{margin:0;color:var(--muted)}.save{border:1px solid var(--line);padding:10px 15px;border-radius:999px;background:#10192b;font-size:13px;color:#b9c5df}.green{display:inline-block;width:8px;height:8px;border-radius:50%;background:#55e0a0;box-shadow:0 0 12px #55e0a0;margin-right:7px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:15px}.nav button,.btn{border:1px solid var(--line);background:var(--panel);color:#aebbd5;border-radius:13px;padding:13px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);border-color:#7185bd;color:white}.nav b{display:block;font-size:16px}.nav small{color:#71809b}.panel{background:#0f1728ed;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 25px 70px #0008}.head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0}.head small{color:var(--muted)}.body{padding:20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.stage{min-height:540px;background:#080d17;border:1px solid #202c45;border-radius:17px;display:flex;align-items:center;justify-content:center;padding:20px}.board{width:min(560px,90vw);aspect-ratio:1;position:relative;border-radius:7px;overflow:hidden}.xiangqi{background:#dfb775;border:8px solid #8e552f;background-image:linear-gradient(#744727 1px,transparent 1px),linear-gradient(90deg,#744727 1px,transparent 1px);background-size:11.11% 10%}.river{position:absolute;top:45%;left:0;right:0;text-align:center;font:22px serif;color:#714024}.piece{position:absolute;transform:translate(-50%,-50%);width:9%;aspect-ratio:1;border-radius:50%;border:2px solid #563b25;background:#f0e3c5;font-size:clamp(14px,3vw,23px);font-weight:bold;cursor:pointer;z-index:2}.piece.red{color:#b32929}.piece.sel{outline:4px solid #62c7ff}.weiqi{background:#d5a65e;border:8px solid #85522e;background-image:linear-gradient(#53341f 1px,transparent 1px),linear-gradient(90deg,#53341f 1px,transparent 1px);background-size:5.55% 5.55%}.spot{position:absolute;transform:translate(-50%,-50%);width:6%;aspect-ratio:1;border-radius:50%;cursor:pointer}.army{background:#d7bf96;border:7px solid #754a31;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}.army button{border:1px solid #765333;border-radius:8px;background:#bd9666;color:#241b14;font-weight:bold;cursor:pointer}.army button.open{background:#eee1c2}.poker{background:radial-gradient(circle,#258055,#093b29);display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:30px}.card{width:82px;height:115px;border:0;border-radius:10px;background:#fff;color:#111;font-size:25px;font-weight:bold;box-shadow:0 8px 18px #0008;cursor:pointer}.card.red{color:#c52d40}.mahjong{background:#4f815d;padding:25px;display:flex;flex-direction:column;justify-content:center;gap:25px}.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}.tile{width:39px;height:55px;border:0;border-radius:5px;background:#f5efd9;color:#222;font:22px serif;box-shadow:0 3px 5px #0007;cursor:pointer}.side{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;height:max-content}.side h3{margin:0 0 12px}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #23304a;color:#a9b6cf}.actions{display:grid;gap:8px;margin-top:15px}.btn.primary{background:#586fc3;color:#fff}.btn.danger{background:#653341;color:#fff}.log{margin-top:13px;max-height:180px;overflow:auto;font-size:12px;line-height:1.8;color:#8796b2}.records{margin-top:18px;border-top:1px solid var(--line);padding-top:17px}.records h3{margin:0 0 8px}.record{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #202b43;color:#aab6ce}.empty{text-align:center;color:#687791;padding:20px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.dialog{width:min(760px,100%);max-height:85vh;overflow:auto;background:#111a2b;border:1px solid #3a4866;border-radius:20px;box-shadow:0 30px 100px #000}.dialog header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog main{padding:20px}.close{background:none;border:0;color:white;font-size:25px;cursor:pointer}.record-detail{border:1px solid #2b3854;background:#0c1423;border-radius:12px;padding:13px;margin:8px 0}.hint{color:#7d8ca7;font-size:12px;margin-top:10px}@media(max-width:850px){.layout{grid-template-columns:1fr}.stage{min-height:420px}.nav{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.app{width:97vw}.body{padding:11px}.stage{padding:8px}.card{width:60px;height:84px;font-size:20px}.tile{width:29px;height:43px;font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="tag">FIVE GAMES · LOCAL ARCADE</div><h1>五局</h1><p>象棋 · 围棋 · 军棋 · 德州扑克 · 麻将</p></div><div class="save"><span class="green"></span>自动保存</div></header>
<nav class="nav" id="nav"></nav>
<main id="app"></main>
</div>
<div class="modal" id="modal"><div class="dialog"><header><b>全部对局记录</b><button class="close" onclick="closeRecords()">×</button></header><main id="recordList"></main></div></div>

<script>
const G=[
{id:"xiangqi",name:"象棋",sub:"中国象棋",icon:"♜"},
{id:"weiqi",name:"围棋",sub:"十九路棋盘",icon:"●"},
{id:"army",name:"军棋",sub:"布阵与翻棋",icon:"⚑"},
{id:"poker",name:"德州扑克",sub:"Texas Hold'em",icon:"♠"},
{id:"mahjong",name:"麻将",sub:"四人牌局",icon:"🀄"}
];
let cur=localStorage.getItem("five_game_current")||"xiangqi";
let db=JSON.parse(localStorage.getItem("five_game_records")||"{}");
let games=JSON.parse(localStorage.getItem("five_game_state")||"{}");
function gs(){return games[cur]??={moves:0,log:[],data:{},records:[]}}
function persist(){localStorage.setItem("five_game_state",JSON.stringify(games));localStorage.setItem("five_game_records",JSON.stringify(db));localStorage.setItem("five_game_current",cur)}
function log(msg){let s=gs();s.moves++;s.log.unshift(new Date().toLocaleTimeString()+" · "+msg);s.log=s.log.slice(0,40);persist();render()}
function nav(){document.getElementById("nav").innerHTML=G.map(g=>`<button class="${g.id==cur?"active":""}" onclick="switchGame('${g.id}')"><b>${g.icon} ${g.name}</b><small>${g.sub}</small></button>`).join("")}
function switchGame(id){cur=id;persist();render()}
function shell(g,board){let s=gs();return `<section class="panel"><div class="head"><div><h2>${g.icon} ${g.name}</h2><small>${g.sub}</small></div><small>本地存档</small></div><div class="body"><div class="layout"><div class="stage">${board}</div><aside class="side"><h3>本局状态</h3><div class="stat"><span>操作次数</span><b>${s.moves}</b></div><div class="stat"><span>保存记录</span><b>${s.records.length}</b></div><div class="actions"><button class="btn primary" onclick="newGame()">新开一局</button><button class="btn" onclick="saveMatch()">保存本局</button><button class="btn" onclick="openRecords()">查看全部记录</button><button class="btn danger" onclick="resetGame()">清空当前游戏</button></div><div class="hint">每次操作都会自动保存。关闭网页后再次打开仍可恢复。</div><div class="log">${s.log.length?s.log.map(x=>`<div>${x}</div>`).join(""):"暂无操作"}</div></aside></div><div class="records"><h3>当前游戏记录</h3>${s.records.length?s.records.map((r,i)=>`<div class="record"><span>#${i+1}　${r.time}</span><span>${r.moves} 次操作</span></div>`).join(""):"<div class='empty'>还没有保存的对局</div>"}</div></div></section>`}
function xq(){let p=[["車",0,0],["馬",1,0],["象",2,0],["士",3,0],["將",4,0],["士",5,0],["象",6,0],["馬",7,0],["車",8,0],["卒",0,3],["卒",2,3],["卒",4,3],["卒",6,3],["卒",8,3],["車",0,9],["馬",1,9],["相",2,9],["仕",3,9],["帥",4,9],["仕",5,9],["相",6,9],["馬",7,9],["車",8,9],["兵",0,6],["兵",2,6],["兵",4,6],["兵",6,6],["兵",8,6]];let b='<div class="board xiangqi"><div class="river">楚河　　　　　　漢界</div>';p.forEach((q,i)=>b+=`<button class="piece ${q[2]>5?"red":""}" style="left:${(q[1]+.5)*100/9}%;top:${(q[2]+.5)*100/10}%" onclick="log('点击${q[0]}')">${q[0]}</button>`);return shell(G[0],b+"</div>")}
function go(){let s=gs(),stones=s.data.stones||[],b='<div class="board weiqi">';stones.forEach(p=>b+=`<i class="spot" style="left:${p[0]*100/18}%;top:${p[1]*100/18}%;background:${p[2]==='b'?'#111':'#eee'};border:${p[2]==='w'?'1px solid #999':''}"></i>`);for(let y=0;y<19;y++)for(let x=0;x<19;x++)b+=`<button class="spot" style="left:${x*100/18}%;top:${y*100/18}%;background:transparent;border:0" onclick="putStone(${x},${y})"></button>`;return shell(G[1],b+"</div>")}
function putStone(x,y){let s=gs();s.data.stones??=[];if(s.data.stones.some(p=>p[0]===x&&p[1]===y))return;s.data.stones.push([x,y,s.moves%2?'w':'b']);s.moves++;s.log.unshift(new Date().toLocaleTimeString()+" · "+(s.moves%2?"黑":"白")+"落子");s.log=s.log.slice(0,40);persist();render()}
function army(){let a=["司令","军长","师长","旅长","团长","营长","连长","排长","工兵","地雷","炸弹","军旗","军长","师长","旅长","团长","营长","连长","排长","工兵","地雷","炸弹","军旗","未知","未知"],s=gs();let open=s.data.open||[],b='<div class="board army">';a.forEach((v,i)=>b+=`<button class="${open.includes(i)?"open":""}" onclick="flipArmy(${i})">${open.includes(i)?v:"?"}</button>`);return shell(G[2],b+"</div>")}
function flipArmy(i){let s=gs();s.data.open??=[];if(s.data.open.includes(i))return;s.data.open.push(i);log("翻开第"+(i+1)+"枚棋子")}
function poker(){let s=gs(),cards=[["A","♠"],["K","♥"],["Q","♦"],["J","♣"],["10","♠"],["9","♥"],["8","♦"],["7","♣"]],b='<div class="board poker">';cards.forEach(c=>b+=`<button class="card ${c[1]=='♥'||c[1]=='♦'?'red':''}" onclick="log('选择 ${c[1]}${c[0]}')">${c[1]}${c[0]}</button>`);return shell(G[3],b+"</div>")}
function mahjong(){let c=["一","二","三","四","五","六","七","八","九","東","南","西","北","中","發","白"],b='<div class="board mahjong"><div class="tiles">';for(let i=0;i<14;i++)b+=`<button class="tile" onclick="log('打出 ${c[i%c.length]}')">${c[i%c.length]}</button>`;b+='</div><div class="tiles">';for(let i=0;i<14;i++)b+=`<button class="tile" onclick="log('选择 ${c[(i+4)%c.length]}')">${c[(i+4)%c.length]}</button>`;return shell(G[4],b+"</div></div>")}
function saveMatch(){let s=gs();s.records.unshift({time:new Date().toLocaleString(),moves:s.moves,log:[...s.log]});s.records=s.records.slice(0,30);db[cur]??=[];db[cur].unshift({time:new Date().toLocaleString(),moves:s.moves,log:[...s.log]});db[cur]=db[cur].slice(0,100);persist();render()}
function openRecords(){let all=[];G.forEach(g=>(db[g.id]||[]).forEach(r=>all.push({...r,game:g.name})));all.sort((a,b)=>b.time.localeCompare(a.time));document.getElementById("recordList").innerHTML=all.length?all.map((r,i)=>`<div class="record-detail"><b>${r.game}</b><br><span>${r.time}　·　${r.moves} 次操作</span><div class="hint">${(r.log||[]).slice(0,8).join("<br>")||"无操作详情"}</div></div>`).join(""):"<div class='empty'>暂无任何保存记录</div>";document.getElementById("modal").classList.add("show")}
function closeRecords(){document.getElementById("modal").classList.remove("show")}
function newGame(){games[cur]={moves:0,log:[],data:{},records:gs().records||[]};persist();render()}
function resetGame(){if(confirm("确定删除这个游戏的全部本地记录和当前进度？")){delete games[cur];delete db[cur];persist();render()}}
function render(){nav();document.getElementById("app").innerHTML=cur==="xiangqi"?xq():cur==="weiqi"?go():cur==="army"?army():cur==="poker"?poker():mahjong()}
render();
</script>
</body>
</html>
