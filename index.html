<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给你</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff5f7;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            text-align: center;
        }

        .box {
            padding: 40px;
        }

        h1 {
            font-size: 42px;
            color: #e85d75;
            margin-bottom: 25px;
        }

        p {
            font-size: 20px;
            color: #555;
            line-height: 2;
        }

        .heart {
            font-size: 60px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="heart">♥</div>

        <h1>我喜欢你</h1>

        <p>
            遇见你之后，<br>
            我的世界好像变得温柔了一点。
        </p>

        <p>
            所以我想认真地告诉你：<br>
            <strong>我喜欢你。</strong>
        </p>
    </div>

</body>
</html>
